<!DOCTYPE html>

<html lang="es"><head><meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Precios 2026 — Omaha High Performance Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#D81E1E;--red-dark:#A81010;--red-bg:#FDF0F0;
  --black:#0F0F0F;--gray-900:#1A1A1A;--gray-700:#444;--gray-500:#888;
  --gray-300:#DEDEDE;--gray-100:#F2F2F0;--white:#FFFFFF;--gold:#B8842A;
  --sidebar-w:210px;--header-h:68px;--bar-h:44px;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--gray-100);color:var(--black);min-height:100vh}

/* HEADER */
header{background:var(--black);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:200;height:var(--header-h)}
.hdr{max-width:1320px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo-wrap{height:57px;flex-shrink:0;display:flex;align-items:center}
.logo-wrap svg{height:57px;width:auto}
.hdr-center{font-size:15px;font-weight:300;letter-spacing:.12em;color:var(--gray-500);white-space:nowrap;text-transform:uppercase}
.hdr-center strong{color:var(--white);font-weight:700}
.hdr-right{text-align:right;line-height:1.6;flex-shrink:0}
.hdr-right span{display:block}
.hdr-date{font-size:13px;font-weight:400;color:var(--white)}
.hdr-tel{font-size:11px;font-weight:400;color:var(--gray-500)}
.hdr-addr{font-size:11px;font-weight:400;color:var(--gray-500)}

/* SEARCHBAR */
.searchbar{background:var(--gray-900);border-bottom:1px solid #2a2a2a;height:var(--bar-h);position:sticky;top:var(--header-h);z-index:190}
.sb-inner{max-width:1320px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;gap:12px}
.sb-field{position:relative;flex:1;max-width:420px}
.sb-field input{width:100%;height:28px;background:#222;border:1px solid #333;border-radius:0;padding:0 12px 0 30px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--white);outline:none;transition:border-color .15s}
.sb-field input:focus{border-color:var(--red)}
.sb-field input::placeholder{color:#555}
.sb-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#555;font-size:14px;pointer-events:none}
.sb-count{font-size:12px;color:#555;white-space:nowrap}
.filter-toggle{display:none;background:none;border:1px solid #333;border-radius:0;color:var(--white);padding:4px 10px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;align-items:center;gap:6px;white-space:nowrap;transition:border-color .15s}
.filter-toggle:hover{border-color:var(--red);color:var(--red)}

/* LAYOUT */
.layout{max-width:1320px;margin:0 auto;display:flex;min-height:calc(100vh - var(--header-h) - var(--bar-h) - 56px)}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--white);border-right:1px solid var(--gray-300);padding:20px 0 40px;position:sticky;top:calc(var(--header-h) + var(--bar-h));height:calc(100vh - var(--header-h) - var(--bar-h));overflow-y:auto;transition:transform .25s ease}
.download-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:calc(100% - 36px);margin:16px 18px 8px;
  padding:10px 14px;
  background:transparent;border:1px solid var(--gray-300);border-radius:0;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;
  color:var(--gray-700);text-transform:uppercase;letter-spacing:.08em;
  transition:all .12s;
}
.download-btn:hover{border-color:#217346;color:#217346}
.download-btn img{flex-shrink:0;width:22px;height:22px}
.sb-label{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#bbb;padding:0 18px;margin-bottom:8px}
.cat-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 18px;background:none;border:none;border-left:3px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;color:var(--gray-700);text-align:left;transition:all .12s;gap:8px}
.cat-btn:hover{background:var(--gray-100);color:var(--black)}
.cat-btn.active{background:var(--red-bg);color:var(--red-dark);border-left-color:var(--red);font-weight:600}
.cat-n{background:var(--gray-100);color:var(--gray-500);font-size:10px;font-weight:600;padding:1px 6px;border-radius:0;min-width:20px;text-align:center;transition:all .12s}
.cat-btn.active .cat-n{background:var(--red);color:var(--white)}
.sb-div{height:1px;background:var(--gray-300);margin:10px 18px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300}

/* MAIN */
.main{flex:1;padding:20px 24px;min-width:0}
.sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px;border-bottom:none}
.sec-hdr h2{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--black);white-space:nowrap}
.sec-line{flex:1;height:2px;background:var(--red)}

/* TABLE — desktop */
.tbl-wrap{background:var(--white);border:1px solid var(--gray-300);border-radius:0;overflow:hidden;margin-bottom:32px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.c-prod{width:40%}
col.c-lista{width:14%}
col.c-pvp{width:13%}
col.c-pre{width:14%}
col.c-iva{width:10%}
col.c-bulto{width:9%}

thead tr{background:var(--black)}
th.th-prod{text-align:left;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#666;padding:9px 14px 9px 92px;white-space:nowrap}
th.th-lista,th.th-pvp,th.th-pre{text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#666;padding:9px 14px;white-space:nowrap}
th.th-iva,th.th-bulto{text-align:center;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#666;padding:9px 14px;white-space:nowrap}

tbody tr{border-bottom:1px solid #F0F0EE;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#FAFAF8}

td.td-prod{text-align:left;padding:10px 14px;vertical-align:middle}
td.td-lista{text-align:center;padding:10px 14px;vertical-align:middle;font-size:13px;font-weight:600;color:var(--black);white-space:nowrap}
td.td-pvp{text-align:center;padding:10px 14px;vertical-align:middle;font-size:13px;font-weight:400;color:var(--gray-500);white-space:nowrap}
td.td-pre{text-align:center;padding:10px 14px;vertical-align:middle;font-size:13px;font-weight:600;color:var(--gold);white-space:nowrap}
.pre-combined .pvp-val{display:none}
.pre-combined .pre-val{display:block}
td.td-iva{text-align:center;padding:10px 14px;vertical-align:middle;font-size:11px;font-weight:400;color:var(--gray-500);white-space:nowrap}
td.td-bulto{text-align:center;padding:10px 14px;vertical-align:middle;font-size:11px;font-weight:400;color:var(--gray-500);white-space:nowrap}

/* product cell */
.pc{display:flex;align-items:center;gap:12px}
.pc img{width:66px;height:52px;object-fit:contain;flex-shrink:0;background:transparent;padding:0}
.pc-meta{display:flex;flex-direction:column;gap:2px}
.pc-code{display:inline-block;background:var(--red);color:var(--white);font-size:10px;font-weight:400;letter-spacing:.04em;padding:1px 5px;border-radius:0;text-transform:uppercase;align-self:flex-start}
.pc-name{font-size:15px;font-weight:700;color:var(--black);text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.pc-desc{font-size:12px;font-weight:400;color:var(--gray-500);line-height:1.35;margin-top:1px}

.empty{padding:60px 20px;text-align:center;color:var(--gray-500);font-size:14px}
.empty strong{color:var(--black)}

/* FOOTER */
footer{background:var(--black);border-top:3px solid var(--red);padding:16px 24px}
.ftr{max-width:1320px;margin:0 auto;text-align:center}
.ftr-name{font-size:13px;font-weight:700;color:var(--white);margin-bottom:3px}
.ftr-contact{font-size:11px;font-weight:400;color:var(--gray-500)}

/* ── TABLET (768px-1024px) — colapsar PVP en combined ── */
/* tablet: JS handles column removal, CSS only handles sizing */
@media(min-width:901px) and (max-width:1024px){
  .main{padding:14px}
  .pc img{width:58px;height:46px}
  .pc-name{font-size:13px}
  td.td-lista{font-size:12px}
  td.td-iva{font-size:11px}
  td.td-bulto{font-size:11px}
}
/* these classes applied by JS on tablet */
.tablet-mode th.th-pvp{display:none}
.tablet-mode td.td-pvp{display:none}
.tablet-mode col.c-pvp{display:none}
.tablet-mode col.c-prod{width:38%}
.tablet-mode col.c-lista{width:16%}
.tablet-mode col.c-pre{width:22%}
.tablet-mode col.c-iva{width:13%}
.tablet-mode col.c-bulto{width:11%}
.tablet-mode .pre-combined{display:flex;flex-direction:column;align-items:center;gap:2px}
.tablet-mode .pre-combined .pvp-val{display:block;font-size:11px;font-weight:400;color:#888;white-space:nowrap}
.tablet-mode .pre-combined .pre-val{display:block;font-size:11px;font-weight:600;color:#B8842A;white-space:nowrap}
.tablet-mode td.td-pre{font-size:11px}

/* ── MOBILE CARD STYLES (fuera de media query para que carguen siempre) ── */
.mob-cards-wrap{display:none}
.expand-bar{display:none}
.expand-btn{display:none}
/* chevron button in searchbar */
.mob-chevron-btn{
  display:none;
  background:none;border:none;cursor:pointer;
  padding:0;width:32px;height:32px;
  align-items:center;justify-content:center;
  flex-shrink:0;
}
.mob-chevron-btn svg{
  width:28px;height:28px;
  transition:transform .25s ease;
}

.mob-card{background:var(--white);border:1px solid var(--gray-300);margin-bottom:8px;overflow:hidden}
.mob-card-header{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;user-select:none}
.mob-card-header img{width:86px;height:68px;object-fit:contain;flex-shrink:0;background:transparent}
.mob-card-info{flex:1;text-align:right}
.mob-card-code{display:inline-block;background:var(--red);color:var(--white);font-size:10px;font-weight:400;letter-spacing:.04em;padding:1px 5px;border-radius:0;text-transform:uppercase;margin-bottom:3px}
.mob-card-name{font-size:14px;font-weight:700;color:var(--black);text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.mob-card-desc{font-size:11px;color:var(--gray-500);margin-top:2px;line-height:1.35}
.mob-card-hint{font-size:10px;color:var(--gray-500);margin-top:5px}
.mob-card-hint::after{content:" ▼";font-size:8px;display:inline-block;transition:transform .2s}
.mob-card.open .mob-card-hint::after{transform:rotate(180deg)}
.mob-card-prices{display:none;border-top:1px solid var(--gray-300)}
.mob-card.open .mob-card-prices{display:block}
.mob-price-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #F4F4F2;font-size:13px}
.mob-price-row:last-child{border-bottom:none}
.mob-price-label{font-size:11px;font-weight:400;color:var(--gray-500)}
.mob-price-lista{font-weight:600;color:var(--black)}
.mob-price-pvp{font-weight:400;color:var(--gray-500)}
.mob-price-pre{font-weight:600;color:var(--gold)}
.mob-price-meta{font-weight:400;color:var(--gray-500)}

/* ── MOBILE (≤680px) ── */
@media(max-width:900px){
  .hdr-center{display:none}
  .filter-toggle{display:flex}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:400;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .layout{display:block}
  .main{padding:10px}
  .mob-cards-wrap{display:block}
  .tbl-wrap table{display:none}
  .mob-chevron-btn{display:flex}
}

@media(max-width:480px){
  .hdr-contact{display:none}
}
/* ── DARK MODE ── */
@media(prefers-color-scheme:dark) and (max-width:900px){
  /* fondo general oscuro */
  body{background:#141414}
  .main{background:#141414}
  .layout{background:#141414}
  .sec-hdr{border-bottom:none}
  .sec-hdr h2{color:#FFFFFF!important}
  .sec-line{background:var(--red)}
  .mob-chevron-btn circle{fill:#555}

  /* header y searchbar más oscuros */
  header{background:#0A0A0A}
  .searchbar{background:#0D0D0D}
  .sb-field input{background:#1A1A1A;border-color:#333;color:#F0F0F0}
  .sb-count{color:#555}

  /* sidebar oscuro */
  .sidebar{background:#1C1C1C;border-right-color:#2A2A2A}
  .sb-label{color:#555}
  .cat-btn{color:#AAA}
  .cat-btn:hover{background:#252525;color:#F0F0F0}
  .cat-btn.active{background:#2A1010;color:#FF7070;border-left-color:var(--red)}
  .cat-n{background:#252525;color:#777}
  .sb-div{background:#2A2A2A}

  /* section header */
  .sec-hdr h2{color:#F0F0F0}

  /* tabla — fondo BLANCO forzado */
  .tbl-wrap{background:#FFFFFF;border-color:#E0E0E0}
  thead tr{background:#111111}
  tbody tr{border-bottom-color:#EEEEEE}
  tbody tr:hover{background:#F8F8F8}
  td.td-prod .pc-name{color:#111}
  td.td-prod .pc-desc{color:#777}
  td.td-lista{color:#111}
  td.td-pvp{color:#777}

  /* cards mobile — fondo BLANCO forzado */
  .tbl-wrap{display:none!important}
  .mob-card{background:#FFFFFF;border-color:#E0E0E0}
  .mob-card-name{color:#111}
  .mob-card-desc{color:#777}
  .mob-card-hint{color:#999}
  .mob-card-prices{border-top-color:#EEEEEE}
  .mob-price-row{border-bottom-color:#EEEEEE}
  .mob-price-label{color:#777}
  .mob-price-lista{color:#111}
  .mob-price-pvp{color:#777}

  /* expand bar */
  .expand-btn{border-color:#CCC;color:#666}
  .expand-btn:hover{border-color:var(--red);color:var(--red)}

  /* footer */
  footer{background:#0A0A0A}
  .ftr-contact{color:#555}
}

.pc-desc{font-size:12px;font-weight:400;color:var(--gray-500);line-height:1.35;margin-top:1px}

.empty{padding:60px 20px;text-align:center;color:var(--gray-500);font-size:14px}
.empty strong{color:var(--black)}

/* FOOTER */
footer{background:var(--black);border-top:3px solid var(--red);padding:16px 24px}
.ftr{max-width:1320px;margin:0 auto;text-align:center}
.ftr-name{font-size:13px;font-weight:700;color:var(--white);margin-bottom:3px}
.ftr-contact{font-size:11px;font-weight:400;color:var(--gray-500)}

/* ── TABLET (768px-1024px) — colapsar PVP en combined ── */
/* tablet: JS handles column removal, CSS only handles sizing */
@media(min-width:901px) and (max-width:1024px){
  .main{padding:14px}
  .pc img{width:58px;height:46px}
  .pc-name{font-size:13px}
  td.td-lista{font-size:12px}
  td.td-iva{font-size:11px}
  td.td-bulto{font-size:11px}
}
/* these classes applied by JS on tablet */
.tablet-mode th.th-pvp{display:none}
.tablet-mode td.td-pvp{display:none}
.tablet-mode col.c-pvp{display:none}
.tablet-mode col.c-prod{width:38%}
.tablet-mode col.c-lista{width:16%}
.tablet-mode col.c-pre{width:22%}
.tablet-mode col.c-iva{width:13%}
.tablet-mode col.c-bulto{width:11%}
.tablet-mode .pre-combined{display:flex;flex-direction:column;align-items:center;gap:2px}
.tablet-mode .pre-combined .pvp-val{display:block;font-size:11px;font-weight:400;color:#888;white-space:nowrap}
.tablet-mode .pre-combined .pre-val{display:block;font-size:11px;font-weight:600;color:#B8842A;white-space:nowrap}
.tablet-mode td.td-pre{font-size:11px}

/* ── MOBILE CARD STYLES (fuera de media query para que carguen siempre) ── */
.mob-cards-wrap{display:none}
.expand-bar{display:none}
.expand-btn{display:none}
/* chevron button in searchbar */
.mob-chevron-btn{
  display:none;
  background:none;border:none;cursor:pointer;
  padding:0;width:32px;height:32px;
  align-items:center;justify-content:center;
  flex-shrink:0;
}
.mob-chevron-btn svg{
  width:28px;height:28px;
  transition:transform .25s ease;
}

.mob-card{background:var(--white);border:1px solid var(--gray-300);margin-bottom:8px;overflow:hidden}
.mob-card-header{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;user-select:none}
.mob-card-header img{width:86px;height:68px;object-fit:contain;flex-shrink:0;background:transparent}
.mob-card-info{flex:1;text-align:right}
.mob-card-code{display:inline-block;background:var(--red);color:var(--white);font-size:10px;font-weight:400;letter-spacing:.04em;padding:1px 5px;border-radius:0;text-transform:uppercase;margin-bottom:3px}
.mob-card-name{font-size:14px;font-weight:700;color:var(--black);text-transform:uppercase;letter-spacing:.03em;line-height:1.25}
.mob-card-desc{font-size:11px;color:var(--gray-500);margin-top:2px;line-height:1.35}
.mob-card-hint{font-size:10px;color:var(--gray-500);margin-top:5px}
.mob-card-hint::after{content:" ▼";font-size:8px;display:inline-block;transition:transform .2s}
.mob-card.open .mob-card-hint::after{transform:rotate(180deg)}
.mob-card-prices{display:none;border-top:1px solid var(--gray-300)}
.mob-card.open .mob-card-prices{display:block}
.mob-price-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #F4F4F2;font-size:13px}
.mob-price-row:last-child{border-bottom:none}
.mob-price-label{font-size:11px;font-weight:400;color:var(--gray-500)}
.mob-price-lista{font-weight:600;color:var(--black)}
.mob-price-pvp{font-weight:400;color:var(--gray-500)}
.mob-price-pre{font-weight:600;color:var(--gold)}
.mob-price-meta{font-weight:400;color:var(--gray-500)}

/* ── MOBILE (≤680px) ── */
@media(max-width:900px){
  .hdr-center{display:none}
  .filter-toggle{display:flex}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:400;transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .layout{display:block}
  .main{padding:10px}
  .mob-cards-wrap{display:block}
  .tbl-wrap table{display:none}
  .mob-chevron-btn{display:flex}
}

@media(max-width:480px){
  .hdr-contact{display:none}
}

/* ── LIGHTBOX ─────────────────────────────────────── */
.lightbox-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.85);z-index:1000;
  align-items:center;justify-content:center;
  cursor:zoom-out;
}
.lightbox-overlay.open{display:flex}
.lightbox-img{
  max-width:90vw;max-height:90vh;
  object-fit:contain;
  border-radius:0;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
  cursor:default;
}
.lightbox-close{
  position:fixed;top:20px;right:24px;
  color:#fff;font-size:28px;font-weight:300;
  cursor:pointer;line-height:1;
  background:none;border:none;padding:4px 8px;
  opacity:.8;transition:opacity .15s;
}
.lightbox-close:hover{opacity:1}

/* imagen clickeable */
.pc img{cursor:zoom-in}
.mob-card-header img{cursor:zoom-in}

/* ── IMAGEN MOBILE — ocupa todo el alto ─────────── */
@media(max-width:900px){
  .mob-card-header{align-items:stretch}
  .mob-card-header img{
    width:130px;height:130px;
    object-fit:contain;
    background:#fff;
  }
}

<script>
let PRODUCTS = [];
let UPDATE_DATE = "";

async function cargarPrecios() {
  try {
    const res = await fetch('precios.json?v=' + Date.now());
    const data = await res.json();
    PRODUCTS = data.productos;
    UPDATE_DATE = data.fecha_actualizacion;
  } catch(e) {
    console.error('Error cargando precios.json:', e);
  }
}

const CATS = ["Compresores","Herramientas Eléctricas","Hidrolavadoras","Generadores"];
let activeCat = "all";
let searchTerm = "";

function fmtPrice(n){
  return "$ " + n.toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function buildSidebar(){
  document.getElementById("n-all").textContent = PRODUCTS.length;
  document.getElementById("headerDate").textContent = UPDATE_DATE;
  const wrap = document.getElementById("catBtns");
  wrap.innerHTML = "";
  CATS.forEach(cat=>{
    const n = PRODUCTS.filter(p=>p.cat===cat).length;
    const btn = document.createElement("button");
    btn.className = "cat-btn";
    btn.dataset.cat = cat;
    const safe = cat.replace(/[^a-z]/gi,"");
    btn.innerHTML = cat+' <span class="cat-n" id="n-'+safe+'">'+n+'</span>';
    btn.onclick = ()=>filterCat(cat,btn);
    wrap.appendChild(btn);
  });
}

function filterCat(cat,btn){
  activeCat=cat;
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(window.innerWidth<=900) closeSidebar();
  render();
}

function getFiltered(){
  return PRODUCTS.filter(p=>{
    const catOk=activeCat==="all"||p.cat===activeCat;
    const q=searchTerm.toLowerCase();
    const srchOk=!q||p.id.toLowerCase().includes(q)||p.nombre.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q);
    return catOk&&srchOk;
  });
}

function render(){
  const filtered=getFiltered();
  const main=document.getElementById("mainContent");
  if(!filtered.length){
    main.innerHTML='<div class="empty">Sin resultados para "<strong>'+searchTerm+'</strong>"</div>';
    return;
  }

  const byCat={};
  filtered.forEach(p=>{ if(!byCat[p.cat]) byCat[p.cat]=[]; byCat[p.cat].push(p); });

  let html="";
  CATS.forEach(cat=>{
    if(!byCat[cat]) return;
    html+=`
    <div class="sec-hdr"><h2>${cat}</h2><div class="sec-line"></div></div>
    <div class="tbl-wrap"><table>
      <colgroup>
        <col class="c-prod"><col class="c-lista"><col class="c-pvp">
        <col class="c-pre"><col class="c-iva"><col class="c-bulto">
      </colgroup>
      <thead><tr>
        <th class="th-prod">Producto</th>
        <th class="th-lista">Precio lista</th>
        <th class="th-pvp">PVP</th>
        <th class="th-pre">PVP / Premium</th>
        <th class="th-iva">IVA</th>
        <th class="th-bulto">Pack</th>
      </tr></thead>
      <tbody>`;
    byCat[cat].forEach(p=>{
      html+=`<tr>
        <td class="td-prod"><div class="pc">
          <img src="${p.img}" alt="${p.nombre}" loading="lazy" onclick="openLightbox(this.src, this.alt)">
          <div class="pc-meta">
            <span class="pc-code">${p.id}</span>
            <div class="pc-name">${p.nombre}</div>
            <div class="pc-desc">${p.desc}</div>
          </div>
        </div></td>
        <td class="td-lista">${fmtPrice(p.precio)}</td>
        <td class="td-pvp">${fmtPrice(p.pvp)}</td>
        <td class="td-pre">
          <div class="pre-combined">
            <span class="pvp-val">${fmtPrice(p.pvp)}</span>
            <span class="pre-val">${fmtPrice(p.premium)}</span>
          </div>
        </td>
        <td class="td-iva">${p.iva}</td>
        <td class="td-bulto">${p.bulto}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;

    // Mobile cards para esta categoría
    let cards=`<div class="mob-cards-wrap">`;
    byCat[cat].forEach(p=>{
      cards+=`<div class="mob-card">
        <div class="mob-card-header" onclick="this.closest('.mob-card').classList.toggle('open')">
          <img src="${p.img}" alt="${p.nombre}" loading="lazy" onclick="openLightbox(this.src, this.alt)">
          <div class="mob-card-info">
            <span class="mob-card-code">${p.id}</span>
            <div class="mob-card-name">${p.nombre}</div>
            <div class="mob-card-desc">${p.desc}</div>
            <div class="mob-card-hint">Ver precios</div>
          </div>
        </div>
        <div class="mob-card-prices">
          <div class="mob-price-row"><span class="mob-price-label">Precio lista</span><span class="mob-price-lista">${fmtPrice(p.precio)}</span></div>
          <div class="mob-price-row"><span class="mob-price-label">PVP</span><span class="mob-price-pvp">${fmtPrice(p.pvp)}</span></div>
          <div class="mob-price-row"><span class="mob-price-label">Premium</span><span class="mob-price-pre">${fmtPrice(p.premium)}</span></div>
          <div class="mob-price-row"><span class="mob-price-label">IVA</span><span class="mob-price-meta">${p.iva}</span></div>
          <div class="mob-price-row"><span class="mob-price-label">Pack</span><span class="mob-price-meta">${p.bulto}</span></div>
        </div>
      </div>`;
    });
    cards+=`</div>`;
    html+=cards;
  });

  main.innerHTML=html;
}

document.getElementById("searchInput").addEventListener("input",function(){
  searchTerm=this.value; render();
});
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("open");
}
function closeSidebar(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
}
function openLightbox(src, alt){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxImg').alt = alt;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeLightbox();
});

function descargarExcel(){
  if(!PRODUCTS || PRODUCTS.length === 0){ alert('Cargando datos...'); return; }

  const fecha = UPDATE_DATE || new Date().toLocaleDateString('es-AR');
  const año = new Date().getFullYear();

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Lista de Precios');

  // Anchos de columna
  ws.columns = [
    {width:22}, {width:48}, {width:16}, {width:10},
    {width:16}, {width:16}, {width:10}

  const r1 = ws.getRow(1);

    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF0F0F0F'}};

  // Título B1:E1

  const titleCell = ws.getCell('B1');

  ws.addImage(logoId, {
    tl: {col:0, row:0, nativeCol:0, nativeRow:0, nativeColOff:60000, nativeRowOff:120000},
    ext: {width:167, height:60}
  });

  // ── Fila 2: headers de columna ──
  ws.getRow(2).height = 20;
  const headers = ['Código','Descripción','Precio Lista','IVA','PVP','Premium','Pack'];
  const hAligns = ['left','left','center','center','center','center','center'];
  headers.forEach((h, i) => {
    const cell = ws.getRow(2).getCell(i+1);
    cell.value = h;
    cell.font = {name:'Arial', size:9, bold:true, color:{argb:'FF666666'}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1A1A1A'}};
    cell.alignment = {horizontal:hAligns[i], vertical:'middle'};
    cell.border = {bottom:{style:'medium', color:{argb:'FFD81E1E'}}};
  });

  // ── Productos ──
  PRODUCTS.forEach((p, idx) => {
    const rowNum = idx + 3;
    const row = ws.getRow(rowNum);
    row.height = 20;
    const bg = idx % 2 === 0 ? 'FFFAFAF8' : 'FFFFFFFF';
    const borderBot = {bottom:{style:'thin', color:{argb:'FFEBEBEB'}}};

    // A: Código
    const cA = row.getCell(1);
    cA.value = p.id;
    cA.font = {name:'Arial', size:11, color:{argb:'FFD81E1E'}};
    cA.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
    cA.alignment = {horizontal:'left', vertical:'middle'};
    cA.border = borderBot;

    // B: Descripción
    const cB = row.getCell(2);
    cB.value = p.nombre + (p.desc ? ' ' + p.desc : '');
    cB.font = {name:'Arial', size:11};
    cB.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
    cB.alignment = {horizontal:'left', vertical:'middle'};
    cB.border = borderBot;

    // C: Precio Lista
    const cC = row.getCell(3);
    cC.value = p.precio || 0;
    cC.font = {name:'Arial', size:11, bold:true};
    cC.numFmt = '$ #,##0.00';
    cC.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
    cC.alignment = {horizontal:'center', vertical:'middle'};
    cC.border = borderBot;

    // D: IVA
    const cD = row.getCell(4);
    cD.value = p.iva || '';
    cD.font = {name:'Arial', size:11, color:{argb:'FF666666'}};
    cD.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
    cD.alignment = {horizontal:'center', vertical:'middle'};
    cD.border = borderBot;

    // E: PVP
    const cE = row.getCell(5);
    cE.value = p.pvp || '—';
    cE.font = {name:'Arial', size:11, color:{argb:'FF666666'}};
    if(typeof p.pvp === 'number' && p.pvp > 0) cE.numFmt = '$ #,##0.00';
    cE.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
    cE.alignment = {horizontal:'center', vertical:'middle'};
    cE.border = borderBot;

    // F: Premium
    const cF = row.getCell(6);
    cF.value = p.premium || '—';
    cF.font = {name:'Arial', size:11, bold:true, color:{argb:'FFB8842A'}};
    if(typeof p.premium === 'number' && p.premium > 0) cF.numFmt = '$ #,##0.00';
    cF.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
    cF.alignment = {horizontal:'center', vertical:'middle'};
    cF.border = borderBot;

    // G: Pack
    const cG = row.getCell(7);
    cG.value = p.bulto || '';
    cG.font = {name:'Arial', size:11, color:{argb:'FF666666'}};
    cG.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bg}};
    cG.alignment = {horizontal:'center', vertical:'middle'};
    cG.border = borderBot;
  });

  // Freeze fila 3
  ws.views = [{state:'frozen', ySplit:2}];

  // Generar y descargar
  const hoy = new Date();
  const dd = String(hoy.getDate()).padStart(2,'0');
  const mm2 = String(hoy.getMonth()+1).padStart(2,'0');
  const yyyy = hoy.getFullYear();
  const filename = `Lista_precios_Omaha_${dd}-${mm2}-${yyyy}.xlsx`;

  wb.xlsx.writeBuffer().then(buffer => {
    const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    saveAs(blob, filename);
  });
}

function toggleExpandAll(){
  const all=document.querySelectorAll('.mob-card');
  const iconExp=document.getElementById('iconExpandir');
  const iconCon=document.getElementById('iconContraer');
  const anyOpen=document.querySelector('.mob-card.open');
  if(anyOpen){
    all.forEach(c=>c.classList.remove('open'));
    if(iconExp) iconExp.style.display='inline';
    if(iconCon) iconCon.style.display='none';
  } else {
    all.forEach(c=>c.classList.add('open'));
    if(iconExp) iconExp.style.display='none';
    if(iconCon) iconCon.style.display='inline';
  }
}

cargarPrecios().then(() => {
  buildSidebar();
  render();
});

// Tablet mode: add/remove class based on viewport width
function applyResponsiveMode(){
  const w = window.innerWidth;
  const body = document.body;
  if(w > 900 && w <= 1024){
    body.classList.add('tablet-mode');
  } else {
    body.classList.remove('tablet-mode');
  }
}
applyResponsiveMode();
window.addEventListener('resize', applyResponsiveMode);
